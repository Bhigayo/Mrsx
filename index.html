nt-weight:700;padding:15px 22px;cursor:pointer;box-shadow:0 8px 30px #e783ad2c;transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}.note{font:11px/1.6 var(--mono);color:#b9aebe}.card{background:linear-gradient(140deg,#21192aeb,#17121fed);border:1px solid var(--line);border-radius:12px;padding:clamp(23px,5vw,46px);box-shadow:0 24px 80px #0004}.intro-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin:26px 0}.side-card{padding:23px;border:1px solid var(--line);border-radius:10px;background:#ffffff06}.side-card .num{font:10px var(--mono);color:var(--gold);letter-spacing:.15em}.side-card p{margin:15px 0 0;color:#d2c5d3;line-height:1.65;font-size:14px}.privacy{margin-top:18px;color:#d2c5d3;font-size:13px;line-height:1.7;border-left:2px solid var(--gold);padding:4px 0 4px 15px}.progressline{display:flex;justify-content:space-between;color:var(--muted);font:11px var(--mono);margin:0 0 13px}.track{height:3px;background:#ffffff16;border-radius:4px;margin-bottom:36px;overflow:hidden}.track span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .4s}.qcat{color:var(--gold);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase;margin-bottom:15px}.qtext{font:600 clamp(25px,4.4vw,39px)/1.2 var(--serif);max-width:690px;margin:0 0 28px}.answers{display:grid;gap:10px}.answer{display:flex;text-align:left;width:100%;gap:14px;align-items:flex-start;border:1px solid var(--line);background:#ffffff05;border-radius:7px;padding:16px 18px;cursor:pointer;transition:.2s;color:#f7edf5}.answer:hover{border-color:#f093b875;background:#f093b811;transform:translateX(3px)}.answer .key{font:11px var(--mono);color:var(--pink);padding-top:3px;flex:0 0 18px}.answer span:last-child{line-height:1.45}.reaction{margin-top:22px;border:1px solid #f093b84c;background:#f093b80b;padding:20px;border-radius:7px;animation:up .35s}.reaction small{display:block;color:var(--pink);font:10px var(--mono);letter-spa <body><div class="grain"></div><header><div class="brand"><b>◆</b> PLAYER TWO?</div><div class="right"><button class="smallbtn" id="sound">♪ SOUND OFF</button><button class="smallbtn" id="reportBtn">PLAYER INSIGHTS ↗</button></div></header><main id="app"></main><div class="footer">A small story, made with intention.<br>PLAYER TWO? · FIRDAUS EDITION</div>
<script>
const questions=[
{cat:'THE WAY I SEE YOU',q:'What do I hope you never underestimate about yourself?',a:['The way your personality makes a conversation feel more alive.','How effortlessly you stay on someone’s mind.','Your confidence, including the moments you don’t notice it.','All the little things that make you unmistakably you.'],r:['That’s the thing: you bring your own kind of light into a room.','Memorable is one word for it. I had a few others in mind.','I notice it. Even when you don’t give yourself enough credit.','Correct. I’ve been paying attention, and the list is getting long.']},
{cat:'THE LITTLE WORLD WE BUILT',q:'My WhatsApp profile photo received a very specific review. What was the main issue?',a:['My face was a little too close to the camera.','The lighting was giving witness-protection interview.','You were conducting a routine quality check.','It was fine; you just enjoy being my creative director.'],r:['A fair critique. My face has since been advised to respect personal space.','I asked for feedback and got a full photographic audit.','Sherlock has competition in the review department.','I knew there was a reason I kept you on the creative team.']},

{cat:'CASE FILE: OUR CONVERSATIONS',q:'When one of my voice notes arrives with a runtime, which department is it from?',a:['Breaking News.','The Daily Briefing.','The Podcast Department.','A limited series that could have been an email.'],r:['Thank you for tuning in. Today’s episode: me finding one more thing to say.','I’ll try to include timestamps in the next edition.','You say podcast; I say exclusive access to my thoughts.','No refunds, but the next episode may be shorter. Maybe.']},
{cat:'THE WAY I SEE YOU',q:'If curiosity were a superpower, yours would look like…',a:['A tiny detail noticed from across the room.','Three follow-up questions before I can blink.','Sherlock Holmes with better timing.','All of the above. I should probably be careful what I say.'],r:['You catch more than you let on, don’t you?','I see the investigation is already underway.','The case is closed. The detective remains suspiciously charming.','Noted. I’ll be choosing my words with care—and enjoying the questions.']},

{cat:'AN UNOFFICIAL REVIEW',q:'You once let it be known that I’m “not fun sometimes.” My appeal is…',a:['Denied. The original verdict stands.','Granted, with strict conditions to improve.','He has moments. We’re monitoring the situation.','I may have been harsh. The defendant is entertaining occasionally.'],r:['I respect a consistent judge. I’ll be submitting new evidence.','Challenge accepted. I’m taking this extremely unseriously.','“Moments” is progress. I’ll take it.','That’s the nicest review I’ve received from this court.']},
{cat:'THE CONNECTION',q:'What do I like most about our back-and-forth?',a:['The teasing never has to try too hard.','You keep me on my toes.','There’s always another little thing to discover.','It feels like us, and I like that.'],r:['You make it very easy to keep the banter going.','I wouldn’t have it any other way. Mostly.','That’s what I’m enjoying too: there’s always more to learn.','That one landed a little closer to the heart. Thank you.']},
{cat:'SAMSUNG GIRL DETECTED',q:'When it comes to the phone debate, what’s your official position?',a:['Samsung, and I’m not taking questions.','Samsung. The evidence speaks for itself.','I’ll hear your argument, but I’ve already decided.','I’m willing to let you be wrong in peace.'],r:['The confidence of someone who has already won the case.','I respect a strong brand ambassador.','A generous offer. I’ll use my appeal wisely.','Kind and merciful. A rare combination.']},
{cat:'A LITTLE MORE HONEST',q:'Somewhere between the jokes and the voice notes, I realised…',a:['I genuinely enjoy having you in my day.','I want to keep learning the small things about you.','You’ve become someone I look forward to talking to.','All three. I’m not especially subtle, am I?'],r:['I’m glad you’re here. That’s the truth of it.','There’s still a lot I’d like to discover, if you’ll let me.','You make the ordinary bits feel less ordinary.','I did warn you I was intentional. No games about that part.']},
{cat:'THE LAST LEVEL BEFORE THE TWIST',q:'One thing I hope you feel when you’re with me is…',a:['Comfortable being exactly yourself.','Appreciated, even in the little moments.','Chosen with care, not just admired from a distance.','A little bit of everything—and never any pressure.'],r:['That matters to me. You should never have to perform.','I notice more than I always manage to say.','That’s the kind of intention I want to show you.','Especially the no-pressure part. You get to choose what feels right.']}
];
const STORE='playerTwoFirdausV1';let data=JSON.parse(localStorage.getItem(STORE)||'null')||{events:[],answers:[],started:null,finished:null,final:null,status:'not started'};let index=data.answers.length,chosen=null,reaction='',soundOn=false;
function persist(){localStorage.setItem(STORE,JSON.stringify(data))}function stamp(){return new Date().toISOString()}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(html){document.querySelector('#app').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function home(){shell(`<section class="hero fade"><div class="eyebrow">A PERSONAL SIDE QUEST · FIRDAUS EDITION</div><h1>PLAYER<br><em>TWO?</em></h1><p class="lede">A little interactive story about the things I’ve noticed, the jokes we’ve kept, and the connection I’m glad we found.</p><div class="hero-foot"><button class="primary" id="begin">START THE STORY&nbsp; →</button><span class="note">12 QUESTIONS · 2 CATEGORIES<br>NO SCORE. JUST A STORY.</span></div></section><div class="intro-grid"><div class="side-card"><div class="num">01 / HOW I SEE YOU</div><p>A few things I appreciate about your personality, your particular spark, and the way you make yourself memorable.</p></div><div class="side-card"><div class="num">02 / OUR CONNECTION</div><p>Little callbacks, easy banter, and the honest bits underneath. There may be a plot twist.</p></div></div><div class="privacy">A quick privacy note: your choices, reactions, progress and final answer are saved in this browser so the person who made this can see a private report on this same device. Nothing is sent to a server or email. This is a local demo, so clearing browser data will erase the report. You can stop at any time.</div>`);document.querySelector('#begin').onclick=start}
function start(){if(!data.started){data.started=stamp();data.status='in progress';data.events.push({type:'started',at:data.started})}persist();index=data.answers.length;renderQ()}
function renderQ(){if(index>=questions.length){plotTwist();return}chosen=null;reaction='';const q=questions[index],pct=Math.round(index/questions.length*100);shell(`<div class="card fade"><div class="progressline"><span>LEVEL ${String(index+1).padStart(2,'0')} / ${questions.length}</span><span>${pct}% COMPLETE</span></div><div class="track"><span style="width:${pct}%"></span></div><div class="qcat">${q.cat}</div><h2 class="qtext">${q.q}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-i="${i}"><span class="key">0${i+1}</span><span>${a}</span></button>`).join('')}</div><div id="react"></div></div>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>select(+b.dataset.i))}
function select(n){if(chosen!==null)return;chosen=n;const q=questions[index],entry={question:index+1,category:q.cat,prompt:q.q,options:q.a,selection:n,answer:q.a[n],reaction:q.r[n],at:stamp()};data.answers.push(entry);data.events.push({type:'answer',...entry});persist();document.querySelector('#react').innerHTML=`<div class="reaction"><small>YOUR HOST HAS A RESPONSE</small><p>${q.r[n]}</p></div><div class="nextrow"><button class="primary" id="next">${index===questions.length-1?'CONTINUE':'NEXT QUESTION'} &nbsp;→</button></div>`;document.querySelector('#next').onclick=()=>{index++;renderQ()}}
function plotTwist(){data.events.push({type:'plot_twist',at:stamp()});persist();shell(`<div class="card ending fade"><div class="eyebrow">SYSTEM UPDATE · NEW OBJECTIVE</div><h2>Wait. You thought this was another quiz.</h2><p>You’ve made it through the callbacks, the allegations, and my very questionable podcast schedule. But the questions were only the route here.</p><p style="color:var(--pink);font-family:var(--serif);font-size:22px">There’s one thing I wanted to ask you for real.</p><button class="primary" id="reveal">SHOW ME THE FINAL QUESTION&nbsp; →</button></div>`);document.querySelector('#reveal').onclick=finalBoss}
function finalBoss(){data.events.push({type:'final_question_shown',at:stamp()});persist();shell(`<div class="card fade"><div class="progressline"><span>PLAYER TWO? · FINAL LEVEL</span><span>NO WRONG ANSWER</span></div><div class="track"><span style="width:100%"></span></div><div class="qcat">NO MORE QUIZ QUESTIONS</div><h2 class="qtext">Firdaus, will you be my girl?</h2><p class="lede" style="font-size:15px;margin-bottom:28px">I’ve really enjoyed what we’ve been building. I like who you are, I value the connection we have, and I’d love the chance to make this official. Whatever your answer, it’s yours to give honestly.</p><div class="answers"><button class="choice" data-final="yes"><strong>YES, I’D LOVE TO BE YOUR GIRL ❤️</strong><span>Let’s make it official.</span></button><button class="choice" data-final="think"><strong>I NEED TO THINK ABOUT IT</strong><span>I’d like to talk first or take a little time.</span></button><button class="choice" data-final="no"><strong>NO, BUT THANK YOU</strong><span>I appreciate this, but I don’t feel the same way.</span></button></div><div class="privacy">Every answer is okay. Choosing “no” or “I need to think” ends the romantic storyline here, with a warm thank-you and no follow-up pressure.</div></div>`);document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>end(b.dataset.final))}
function end(v){data.final={answer:v,at:stamp()};data.status='completed';data.finished=stamp();data.events.push({type:'final_answer',answer:v,at:data.final.at},{type:'completed',at:data.finished});persist();const yes=v==='yes';shell(`<div class="card ending fade"><div class="eyebrow">${yes?'NEW PLAYER TWO UNLOCKED':'THANK YOU FOR PLAYING'}</div><h2>${yes?'I’m very glad you said yes. ❤️':v==='think'?'Of course. Take the time you need.':'Thank you for being honest with me.'}</h2><p>${yes?'This is the start of something I’m excited about. No more pretending this was only a game. I’m really happy it’s you.':v==='think'?'No rush and no pressure to decide in the moment. I respect that, and we can talk whenever you’re ready.': 'I appreciate you hearing me out. I respect your answer completely, and I’m wishing you nothing but good things.'}</p><p style="font:11px var(--mono);color:#aa9bab">${yes?'THE END? MORE LIKE A NEW SAVE FILE.':'STORY COMPLETE · YOUR ANSWER HAS BEEN RESPECTED.'}</p></div>`)}
function report(){const rows=data.answers.map(x=>`<div class="report-row"><div><small>QUESTION ${String(x.question).padStart(2,'0')} · ${safe(x.category)} · ${new Date(x.at).toLocaleString()}</small><strong>${safe(x.prompt)}</strong><div style="font-size:13px;color:var(--pink);margin-top:6px">${safe(x.answer)}</div><div style="font-size:12px;color:var(--muted);margin-top:5px">Reaction: ${safe(x.reaction)}</div></div><span class="tag">${String.fromCharCode(65+x.selection)}</span></div>`).join('');let final=data.final?`<div class="side-card" style="margin-top:22px"><div class="num">FINAL ANSWER · ${new Date(data.final.at).toLocaleString()}</div><p style="font-size:18px;color:var(--ink)">${data.final.answer==='yes'?'Yes, I’d love to be your girl ❤️':data.final.answer==='think'?'I need to think about it / want to talk first':'No, but thank you'}</p></div>`:'';shell(`<div class="card fade"><div class="eyebrow">PRIVATE · THIS BROWSER ONLY</div><h2 style="margin:12px 0 9px">Player insights</h2><p class="note" style="font-family:var(--sans);font-size:13px">Status: ${safe(data.status)}${data.started?' · Started '+new Date(data.started).toLocaleString():''}${data.finished?' · Finished '+new Date(data.finished).toLocaleString():''}</p><div class="privacy">This report is stored in local browser storage on this device. There is no login or server connection, so it is not protected from someone else who can use this browser profile. Answers are not uploaded anywhere.</div>${data.answers.length?rows:'<p class="empty" style="margin-top:24px">No answers yet. Once the story begins, each selection and its reaction will appear here.</p>'}${final}<div class="hero-foot" style="margin-top:25px"><button class="smallbtn" id="back">← BACK</button><button class="smallbtn" id="export">DOWNLOAD REPORT JSON</button><button class="smallbtn" id="clear">CLEAR LOCAL REPORT</button></div></div>`);document.querySelector('#back').onclick=home;document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='player-two-player-report.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clear').onclick=()=>{if(confirm('Clear this device’s saved PLAYER TWO? answers?')){localStorage.removeItem(STORE);data={events:[],answers:[],started:null,finished:null,final:null,status:'not started'};home()}}}
let audioCtx=null,ambient=null;function toggleSound(){soundOn=!soundOn;if(soundOn){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();ambient=audioCtx.createOscillator();const gain=audioCtx.createGain();ambient.type='sine';ambient.frequency.value=110;gain.gain.value=.018;ambient.connect(gain);gain.connect(audioCtx.destination);ambient.start()}else if(ambient){ambient.stop();ambient=null}document.querySelector('#sound').textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';document.querySelector('#sound').classList.toggle('sound-on',soundOn)}
document.querySelector('#reportBtn').onclick=report;document.querySelector('#sound').onclick=toggleSound;if(data.status==='in progress')home();else home();
</script></body></html>
